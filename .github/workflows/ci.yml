name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @mimimo/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @mimimo/playground test:browser --workers=2
      - run: pnpm --filter @mimimo/docs test:browser --workers=2
      - run: pnpm check:packages
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
